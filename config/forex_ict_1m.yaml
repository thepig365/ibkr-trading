# Forex ICT 1-minute PAPER TEST mode — SEPARATE from US stock ICT (ict_smc_intraday_v1).
# Flip enabled only after dry-run readiness; never enables live trading from this file.

strategy_id: ict_fx_1m_test
asset_class: forex
mode: paper
enabled: false

pairs:
  - AUD/USD
  - USD/JPY
  - AUD/JPY
  - NZD/USD
  - EUR/JPY
  - AUD/NZD

session:
  timezone: Australia/Melbourne
  window: "09:00-17:00"
  days: ["Mon", "Tue", "Wed", "Thu", "Fri"]

ibkr:
  exchange: IDEALPRO
  sec_type: CASH
  client_id_roster: forex_fetch

risk:
  max_daily_loss_r: 3
  max_trades_per_day: 10
  max_trades_per_pair: 3
  max_open_positions: 3
  max_units_per_trade: 100000
  min_order_size_check: true
  paper_only: true
  no_market_orders: true
  bracket_required: true
  risk_per_trade_pct: 0.05

execution:
  order_type: LMT
  allow_marketable_limit: false
  tif: DAY
  outside_rth: true
  submit_to_broker: false
  capture_order_status: true
  capture_reject_reason: true
  order_ref_prefix: STRATEGYLAB_FX_ICT_1M
