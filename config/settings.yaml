# Global runtime configuration for the bot.
# This file is the single source of truth for safety toggles.
# Anything potentially dangerous defaults to OFF.

account:
  # `paper` is the only allowed value while block_live_trading is true.
  mode: paper
  # Hard switch: if true, any attempt to connect to a live account or to
  # place an order is rejected by the safety layer.
  block_live_trading: true

trading:
  # Master switch. While false, broker.place_order() raises immediately.
  enabled: false
  # If a place_order call somehow runs, default to dry_run = True.
  dry_run_default: true
  # Even with trading.enabled = true, every order requires explicit
  # confirmation from the operator.
  require_manual_confirmation: true
  # MTF (Prompt 10C): full-auto paper IBKR bracket when scan uses
  # --paper-bracket, alignment is FULL, and mtf_paper_dry_run is false.
  # Requires account.mode: paper, trading.enabled: true, and TWS
  # connection with readonly=False for submission.
  mtf_paper_bracket_enabled: false
  mtf_paper_bypass_manual_confirmation: true
  mtf_paper_dry_run: true
  mtf_paper_require_full_alignment: true
  # 10G: paper bracket may run only with FULL + 5m trigger confirmed (enforced
  # in mtf_paper_may_run when true; aligns with run_mtf_smc elig).
  mtf_paper_require_confirmed_5m: true
  # 10G: if true, mtf-trigger-check / mtf-trigger-watch may use --auto-paper-bracket
  # to call the same IBKR path as --paper-bracket (still requires trading.enabled,
  # mtf_paper_bracket_enabled, account paper, etc.).
  mtf_paper_auto_bracket_enabled: false
  # 10H / full-auto paper: loop + `auto-paper-mtf` check this + data/runtime/mtf_auto_paper_enabled
  mtf_auto_paper:
    enabled: false
    account_mode: paper
    allow_live_trading: false
    fully_automatic: false
  # 13F: ICT/SMC intraday paper bracket execution (PAPER only; never live).
  # Defaults are intentionally safe: enabled=false, dry_run=true, plus a
  # runtime kill switch at data/runtime/intraday_auto_paper_enabled.
  # Hard invariants (paper_only / live_trading_allowed / market_orders_allowed
  # / bracket_required / stop_required / target_required) are enforced by the
  # config loader and the broker; do not flip them.
  intraday_paper:
    enabled: false
    fully_automatic: false
    allow_strict_entries: true
    allow_aggressive_entries: true
    risk_per_trade_pct: 0.10
    max_concurrent_positions: 5
    max_one_position_per_symbol: true
    require_reconciliation_pass: true
    no_new_entries_before: "09:45"
    no_new_entries_after: "15:30"
    exit_open_positions_at: "15:55"
    paper_only: true
    live_trading_allowed: false
    market_orders_allowed: false
    bracket_required: true
    stop_required: true
    target_required: true
    dry_run: true
    min_rr: 1.2
  # Asset class allow-list. All disabled in the foundation milestone.
  allow_options: false
  allow_crypto: false
  allow_forex: false
  allow_shorting: false
  # 13F: shorting is required for intraday short setups. Operators who
  # want to forward-test shorts must flip allow_shorting to true in
  # ``settings.local.yaml`` (gitignored). Tracked default stays false.

risk:
  max_account_risk_per_trade_pct: 1.0
  max_equity_per_position_pct: 10
  max_open_positions: 5
  # If reconciliation fails, the risk engine refuses to authorize any
  # new trades on the next bar.
  block_new_trades_if_reconciliation_fails: true

notifications:
  telegram:
    enabled: true
    # privacy_mode redacts account numbers, bot tokens, dollar amounts and
    # exact account values (NetLiquidation, TotalCash, etc.) before the
    # message leaves the bot. Leave this on unless you fully trust the
    # chat you're sending to.
    privacy_mode: true
    # Telegram Bot API parse_mode. HTML is safer than Markdown because
    # we can html.escape() body text and keep the tags we control.
    parse_mode: HTML

paths:
  data_dir: data
  memory_dir: memory
  sqlite_file: data/trading_bot.sqlite
  orders_jsonl: data/orders.jsonl
  executions_jsonl: data/executions.jsonl
  account_snapshots_jsonl: data/account_snapshots.jsonl
  daily_summary_md: memory/DAILY-SUMMARY.md

logging:
  level: INFO

# Per-timeframe IBKR candle presets used by the SMC/ICT research
# scanner (Prompt 10A). These govern how candles are pulled, NOT
# whether the bot can trade. execution_allowed stays false globally.
smc_timeframes:
  daily:
    enabled: true
    duration: "1 Y"
    bar_size: "1 day"
    use_rth: true
    min_bars: 150
    max_bars: 400
    role: "macro_bias"

  4h:
    enabled: true
    duration: "60 D"
    bar_size: "4 hours"
    use_rth: true
    min_bars: 80
    max_bars: 300
    role: "structure_confirmation"

  30min:
    enabled: true
    duration: "20 D"
    bar_size: "30 mins"
    use_rth: true
    min_bars: 100
    max_bars: 300
    role: "setup_detector"

  5min:
    enabled: true
    duration: "5 D"
    bar_size: "5 mins"
    use_rth: true
    min_bars: 100
    max_bars: 500
    role: "entry_trigger"

market_regime:
  # These knobs drive bot.market_regime.evaluate_regime() only. They
  # never enable execution - execution remains disabled globally.
  allow_medium_confidence_for_research: true
  allow_medium_confidence_for_new_positions: false
  require_vix_for_execution: true
  require_spy_200ma_for_execution: true
  require_qqq_200ma_for_execution: false
