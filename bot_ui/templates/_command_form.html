{# Reusable button that posts to /api/commands/run.
   args: { command, label, return_to, args (optional whitespace string), btn_class (optional) }
#}
<form action="{{ url_for('api_run_command') }}" method="post" style="display:inline-block; margin-right:6px;">
  <input type="hidden" name="command" value="{{ command }}" />
  {% if args %}<input type="hidden" name="args" value="{{ args }}" />{% endif %}
  <input type="hidden" name="return_to" value="{{ ret(return_to) }}" />
  <button type="submit" class="btn {{ btn_class or 'ghost' }}">{{ label or command }}</button>
</form>
